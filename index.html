<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Papa's guide for the China trip, 24 Oct to 3 Nov 2026. Choose your free days and get your phone ready.">
<title>Papa's China Trip</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✈️%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f6f6;
    --card: #ffffff;
    --text: #12201f;
    --muted: #3a4847;
    --line: #c9d3d2;
    --accent: #0a6560;
    --accent-ink: #ffffff;
    --accent-soft: #e0f0ee;
    --amber-bg: #fff3d6;
    --amber-line: #a35f00;
    --amber-ink: #4f3200;
    --red-bg: #fde9e7;
    --red-line: #b42318;
    --red-ink: #6e130c;
    --green: #146c34;
    --green-ink: #ffffff;
    --tbd-bg: #e3e5e5;
    --tbd-ink: #2f3535;
    --c-conf: #0a6560;
    --c-sha: #2c55a8;
    --c-free: #7a3fa0;
    --c-home: #5b6463;
    --dot-off: #c3cccb;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1514;
      --card: #172120;
      --text: #eef4f3;
      --muted: #c2cecc;
      --line: #34413f;
      --accent: #5cc8bd;
      --accent-ink: #04201d;
      --accent-soft: #15302d;
      --amber-bg: #33260a;
      --amber-line: #f0b54a;
      --amber-ink: #ffe3a6;
      --red-bg: #3a1512;
      --red-line: #ff8a7a;
      --red-ink: #ffd4cd;
      --green: #3ccf6e;
      --green-ink: #03200c;
      --tbd-bg: #3a4342;
      --tbd-ink: #eef4f3;
      --c-conf: #5cc8bd;
      --c-sha: #8fb0f5;
      --c-free: #d19af5;
      --c-home: #a9b3b2;
      --dot-off: #46524f;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    font-size: 19px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  h1 { font-size: 30px; line-height: 1.25; margin: 4px 0 12px; }
  h2 { font-size: 22px; line-height: 1.3; margin: 0 0 8px; }
  h3 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 10px; }
  ul, ol { margin: 0 0 10px; padding-left: 24px; }
  li { margin-bottom: 6px; }
  a { color: var(--accent); }
  strong { font-weight: 700; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* Sticky top bar */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 8px 16px 10px;
    padding-top: max(8px, env(safe-area-inset-top));
  }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stepcount { font-weight: 700; font-size: 19px; margin: 0; }
  .menu-btn {
    min-height: 56px; padding: 0 16px; font: inherit; font-size: 18px; font-weight: 600;
    background: var(--accent-soft); color: var(--text); border: 2px solid var(--accent); border-radius: 14px; cursor: pointer;
  }
  .progress { height: 10px; background: var(--dot-off); border-radius: 99px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 14%; transition: width .3s; }
  .menu { margin-top: 10px; }
  .menu ol { list-style: none; padding: 0; margin: 0; }
  .menu li { margin: 0 0 6px; }
  .menu button {
    width: 100%; min-height: 56px; text-align: left; font: inherit; font-size: 19px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; cursor: pointer;
  }
  .menu button[aria-current="step"] { border: 2px solid var(--accent); font-weight: 700; }

  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  .step:focus { outline: none; }
  .lead { font-size: 20px; }

  /* Cards */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; margin: 0 0 16px; box-shadow: var(--shadow); scroll-margin-top: 110px;
  }
  .card-title { display: flex; gap: 10px; align-items: flex-start; }
  .emoji { font-size: 28px; line-height: 1.1; flex: none; }
  .card.amber { background: var(--amber-bg); border: 2px solid var(--amber-line); color: var(--amber-ink); }
  .card.red { background: var(--red-bg); border: 2px solid var(--red-line); color: var(--red-ink); }
  .card.amber a, .card.red a { color: inherit; }
  .tag {
    display: inline-block; font-size: 16px; font-weight: 700; border-radius: 8px; padding: 2px 10px; margin: 0 0 8px;
  }
  .tag.amber { background: var(--amber-line); color: var(--card); }
  .tag.red { background: var(--red-line); color: var(--card); }
  .tag.rec { background: var(--accent); color: var(--accent-ink); }

  details.more { margin-top: 6px; }
  details > summary {
    min-height: 56px; display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-weight: 700; color: var(--accent); list-style: none;
  }
  .card.amber details > summary, .card.red details > summary { color: inherit; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸"; font-size: 20px; transition: transform .2s; }
  details[open] > summary::before { transform: rotate(90deg); }
  details .inner { padding: 4px 0 6px; }

  /* "To be confirmed" chip */
  .tbd {
    display: inline-block; background: var(--tbd-bg); color: var(--tbd-ink);
    font-size: 16px; font-weight: 600; border-radius: 99px; padding: 1px 10px; white-space: nowrap; vertical-align: 1px;
  }

  /* Timeline */
  .legend { display: grid; gap: 10px; margin: 0 0 16px; }
  .legend-item { display: flex; gap: 12px; align-items: flex-start; }
  .swatch { width: 22px; height: 22px; border-radius: 6px; flex: none; margin-top: 4px; }
  .days { list-style: none; padding: 0; margin: 0; }
  .day {
    display: grid; grid-template-columns: 108px 1fr; gap: 10px; align-items: start;
    padding: 10px 0 10px 14px; border-left: 8px solid var(--line); margin: 0 0 4px; border-radius: 4px;
  }
  .day-date { font-weight: 700; white-space: nowrap; }
  .b-conf { border-left-color: var(--c-conf); }
  .b-sha { border-left-color: var(--c-sha); }
  .b-free { border-left-color: var(--c-free); }
  .b-home { border-left-color: var(--c-home); }
  .bg-conf { background: var(--c-conf); }
  .bg-sha { background: var(--c-sha); }
  .bg-free { background: var(--c-free); }
  .bg-home { background: var(--c-home); }
  .day-label { display: block; font-size: 16px; font-weight: 700; color: var(--muted); }

  /* Options */
  .option.selected { border: 3px solid var(--accent); }
  .meters { display: grid; gap: 6px; margin: 10px 0 12px; }
  .meter { display: grid; grid-template-columns: 9.5em auto 1fr; gap: 10px; align-items: center; }
  .dots { display: inline-flex; gap: 6px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--dot-off); }
  .dot.on { background: var(--accent); }
  .meter-word { color: var(--muted); font-size: 17px; }
  .plan { list-style: none; padding: 0; }
  .plan li { padding-left: 0; }
  .label { font-weight: 700; }

  /* Buttons */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 60px; padding: 10px 16px; margin: 8px 0 0;
    font: inherit; font-size: 20px; font-weight: 700; text-align: center; text-decoration: none;
    border-radius: 14px; border: 2px solid var(--accent); background: var(--card); color: var(--accent); cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.green { background: var(--green); border-color: var(--green); color: var(--green-ink); font-size: 21px; min-height: 72px; }
  .choose[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .choose .on-txt { display: none; }
  .choose[aria-pressed="true"] .on-txt { display: inline; }
  .choose[aria-pressed="true"] .off-txt { display: none; }

  .pills { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 8px 0 4px; }
  .pill {
    min-height: 56px; padding: 8px 12px; font: inherit; font-size: 19px; font-weight: 600;
    border: 2px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text); cursor: pointer;
  }
  .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pill[aria-pressed="true"]::before { content: "✓ "; }

  .ticks { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 10px; }
  .ticks li { margin: 0; }
  .tick {
    width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; text-align: left;
    padding: 8px 14px; font: inherit; font-size: 19px; color: var(--text);
    border: 2px solid var(--line); border-radius: 14px; background: var(--card); cursor: pointer;
  }
  .box {
    width: 30px; height: 30px; flex: none; border: 3px solid var(--muted); border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px;
  }
  .tick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .tick[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tick[aria-pressed="true"] .box::after { content: "✓"; }

  /* Walkthrough */
  .walk { display: grid; grid-template-columns: 52px 1fr; gap: 12px; }
  .num {
    width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .walk-done { grid-column: 1 / -1; }
  .done[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .done .on-txt { display: none; }
  .done[aria-pressed="true"] .on-txt { display: inline; }
  .done[aria-pressed="true"] .off-txt { display: none; }

  .applist { list-style: none; padding: 0; margin: 0; }
  .applist li { border-top: 1px solid var(--line); padding: 10px 0; margin: 0; }
  .applist li:first-child { border-top: 0; padding-top: 0; }
  .where { display: inline-block; font-size: 16px; font-weight: 600; background: var(--accent-soft); border-radius: 8px; padding: 1px 8px; }

  .zh { font-size: 28px; line-height: 1.4; font-weight: 700; margin: 0; }
  .zh-row { border-top: 1px solid var(--line); padding: 10px 0; }
  .zh-row:first-of-type { border-top: 0; }
  .zh-en { color: var(--muted); }

  /* Places */
  .group-title { font-size: 26px; margin: 28px 0 4px; }
  .photo { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 12px; margin: 0 0 12px; background: var(--line); }
  .place-name { font-size: 23px; margin: 0 0 8px; }
  .zh-name { display: block; font-size: 19px; font-weight: 600; color: var(--muted); }
  .facts { margin: 0 0 12px; display: grid; gap: 8px; }
  .facts > div { display: grid; grid-template-columns: 8.2em 1fr; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
  .facts dt { font-weight: 700; }
  .facts dd { margin: 0; min-width: 0; }
  .facts .dots { vertical-align: -3px; margin-right: 6px; }
  @media (max-width: 400px) { .facts > div { grid-template-columns: 1fr; gap: 2px; } }

  /* Step 8 */
  .summary { list-style: none; padding: 0; margin: 0; }
  .summary li { border-top: 1px solid var(--line); padding: 10px 0; margin: 0; }
  .summary li:first-child { border-top: 0; padding-top: 0; }
  .summary .val { display: block; font-weight: 700; }
  .notyet { color: var(--muted); font-weight: 600; }
  .linkbtn {
    font: inherit; font-size: 18px; color: var(--accent); background: none; border: 0; padding: 0;
    min-height: 56px; text-decoration: underline; cursor: pointer;
  }
  .q { margin: 0 0 18px; }
  .q:last-child { margin-bottom: 0; }
  .q-title { font-weight: 700; margin: 0 0 4px; }
  .preview {
    white-space: pre-wrap; font: inherit; font-size: 17px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin: 10px 0 0;
  }
  .status { min-height: 1.5em; font-weight: 700; color: var(--accent); margin-top: 8px; }

  .stepnav { display: grid; grid-template-columns: 1fr 1.6fr; gap: 12px; margin-top: 24px; }
  .stepnav .btn { margin: 0; }
  .stepnav .only { grid-column: 1 / -1; }
  .upnext { text-align: right; color: var(--muted); font-size: 17px; margin-top: 8px; }

  .storage-note {
    max-width: 640px; margin: 12px auto 0; padding: 12px 16px; background: var(--amber-bg); color: var(--amber-ink);
    border: 2px solid var(--amber-line); border-radius: 14px; font-size: 17px;
  }
  @media (max-width: 400px) {
    .meter { grid-template-columns: 7.6em auto 1fr; gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <p class="stepcount" id="stepCount">Step 1 of 7</p>
    <button type="button" id="menuBtn" class="menu-btn" aria-expanded="false" aria-controls="menu">☰ All steps</button>
  </div>
  <div class="progress" id="progress" role="progressbar" aria-label="How far you are" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <nav id="menu" class="menu" hidden aria-label="All steps"><ol id="menuList"></ol></nav>
</header>

<div class="storage-note" id="storageNote" hidden role="status">
  This phone is not saving your answers. That is OK. Just finish all steps and press the green button at the end.
</div>

<main id="app"></main>

/* ----- Saving answers (works even if the phone blocks storage) ----- */
const DEFAULT_STATE = {
  step: 1, freeDays: "", places: {}, interest: "", internet: "",
  appDone: {}, answers: {}, checklist: {}
};
const storage = {
  ok: true,
  load() {
    try {
      const t = "__t";
      localStorage.setItem(t, "1"); localStorage.removeItem(t);
      const raw = localStorage.getItem(TRIP.storageKey);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { this.ok = false; return null; }
  },
  save(s) {
    if (!this.ok) return;
    try { localStorage.setItem(TRIP.storageKey, JSON.stringify(s)); }
    catch (e) { this.ok = false; showStorageNote(); }
  }
};
let state = Object.assign({}, DEFAULT_STATE, storage.load() || {});
["places", "appDone", "answers", "checklist"].forEach(k => {
  if (!state[k] || typeof state[k] !== "object") state[k] = {};
});
function showStorageNote() { document.getElementById("storageNote").hidden = false; }
if (!storage.ok) showStorageNote();

/* ----- Small helpers ----- */
const TOTAL = TRIP.stepTitles.length;
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
const CHIP = '<span class="tbd">To be confirmed</span>';
function t(s) {
  if (s === "TBD") return CHIP;
  return esc(s).replace(/\{TBD\}/g, CHIP).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}
function plain(s) { return String(s).replace(/\*\*/g, "").replace(/\s*\{TBD\}/g, " (to be confirmed)"); }
function paras(lines) { return (lines || []).map(l => `<p>${t(l)}</p>`).join(""); }
function more(lines, list) {
  if (!(lines && lines.length) && !(list && list.length)) return "";
  const body = paras(lines) + (list ? `<ul>${list.map(i => `<li>${t(i)}</li>`).join("")}</ul>` : "");
  return `<details class="more"><summary>Tell me more</summary><div class="inner">${body}</div></details>`;
}
function card(c, extra) {
  const tone = c.tone ? " " + c.tone : "";
  const tag = c.tone === "red" ? '<span class="tag red">Must do</span>' : c.tone === "amber" ? '<span class="tag amber">Important</span>' : "";
  const icon = c.icon ? `<span class="emoji" aria-hidden="true">${c.icon}</span>` : "";
  return `<article class="card${tone}">${tag}<h2 class="card-title">${icon}<span>${t(c.title)}</span></h2>
    ${paras(c.lines)}${extra || ""}${more(c.more, c.moreList)}</article>`;
}
const WORDS = ["None", "Low", "Medium", "High"];
function meterDots(label, n) {
  let dots = "";
  for (let i = 0; i < 3; i++) dots += `<span class="dot${i < n ? " on" : ""}"></span>`;
  return `<span class="dots" role="img" aria-label="${label}: ${n} out of 3">${dots}</span>`;
}
function meter(label, n) {
  let dots = "";
  for (let i = 0; i < 3; i++) dots += `<span class="dot${i < n ? " on" : ""}"></span>`;
  return `<div class="meter"><span class="label">${label}</span>
    <span class="dots" role="img" aria-label="${label}: ${n} out of 3">${dots}</span>
    <span class="meter-word" aria-hidden="true">${WORDS[n]}</span></div>`;
}
function pills(key, options) {
  return `<div class="pills">${options.map(o =>
    `<button type="button" class="pill" data-key="${key}" data-val="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join("")}</div>`;
}
function ticks(group, items) {
  return `<ul class="ticks">${items.map(i =>
    `<li><button type="button" class="tick" data-multi="${group}" data-val="${esc(i)}" aria-pressed="false"><span class="box" aria-hidden="true"></span><span>${t(i)}</span></button></li>`).join("")}</ul>`;
}
function waNumber() {
  const n = String(TRIP.helperWhatsApp).replace(/\D/g, "");
  return TRIP.helperWhatsApp === "TBD" ? "" : n;
}
function waLink(text) { return "https://wa.me/" + waNumber() + "?text=" + encodeURIComponent(text); }

/* ----- Summary text for WhatsApp ----- */
function choiceLabel(list, id, field) {
  const o = list.find(x => x.id === id);
  return o ? plain(o[field || "title"]) : "";
}
function summaryRows() {
  const f = TRIP.freeDays, s = TRIP.send;
  const liked = [].concat(...TRIP.places.groups.map(g => g.items)).filter(x => state.places[x.id]).map(x => plain(x.name));
  const rows = [
    { label: "Places I'd like to see", value: liked.join(", "), step: 3 },
    { label: "Free days (31 Oct to 2 Nov)", value: choiceLabel(f.options, state.freeDays), step: 4 },
    { label: "Business interest", value: state.interest, step: 4 },
    { label: "Internet", value: choiceLabel(TRIP.internet.options, state.internet), step: 5 }
  ];
  s.questions.forEach(q => rows.push({ label: q.short || q.q, value: state.answers[q.id] || "", step: 8 }));
  return rows;
}
function buildMessage() {
  const s = TRIP.send;
  const lines = [s.messageTitle, ""];
  summaryRows().forEach(r => lines.push(`${r.label}: ${r.value || "Not answered yet"}`));
  const done = s.checklist.filter(c => state.checklist[c]);
  const todo = s.checklist.filter(c => !state.checklist[c]);
  const appSteps = Object.keys(state.appDone).filter(k => state.appDone[k]).length;
  lines.push("", `Phone setup (Step 6): ${appSteps} of ${TRIP.apps.walkthrough.length} steps done`);
  lines.push("", "Before you fly, done:");
  lines.push(done.length ? done.map(d => "✅ " + d).join("\n") : "Nothing ticked yet");
  lines.push("", "Still to do:");
  lines.push(todo.length ? todo.map(d => "⬜ " + d).join("\n") : "All done!");
  return lines.join("\n");
}
function renderSummary() {
  const ul = document.getElementById("summaryList");
  if (!ul) return;
  ul.innerHTML = summaryRows().slice(0, 4).map(r => `<li>${esc(r.label)}
    ${r.value ? `<span class="val">${esc(r.value)}</span>`
      : `<span class="val notyet">Not chosen yet</span><button type="button" class="linkbtn" data-go="${r.step}">Go to Step ${r.step}</button>`}</li>`).join("");
  const msg = buildMessage();
  document.getElementById("preview").textContent = msg;
  document.getElementById("sendBtn").href = waLink(msg);
}

/* ----- Keep buttons in sync with saved answers ----- */
function getVal(key) {
  return key.split(".").reduce((o, k) => (o ? o[k] : undefined), state);
}
function setVal(key, val) {
  const parts = key.split(".");
  let o = state;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = val;
}
function refresh() {
  document.querySelectorAll("[data-key]").forEach(b => {
    const on = getVal(b.dataset.key) === b.dataset.val;
    b.setAttribute("aria-pressed", on ? "true" : "false");
    const opt = b.closest(".option");
    if (opt && b.classList.contains("choose")) opt.classList.toggle("selected", on);
  });
  document.querySelectorAll("[data-multi]").forEach(b => {
    b.setAttribute("aria-pressed", state[b.dataset.multi][b.dataset.val] ? "true" : "false");
  });
  renderSummary();
}

/* ----- Moving between steps ----- */
function go(n, focus) {
  n = Math.min(TOTAL, Math.max(1, n | 0));
  state.step = n;
  storage.save(state);
  document.querySelectorAll(".step").forEach(s => { s.hidden = s.dataset.step !== String(n); });
  document.getElementById("stepCount").textContent = `Step ${n} of ${TOTAL}`;
  const p = document.getElementById("progress");
  p.setAttribute("aria-valuenow", n);
  p.setAttribute("aria-valuetext", `Step ${n} of ${TOTAL}`);
  document.getElementById("progressFill").style.width = (n / TOTAL * 100) + "%";
  document.querySelectorAll("#menuList button").forEach(b => {
    if (b.dataset.go === String(n)) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
  });
  closeMenu();
  window.scrollTo(0, 0);
  if (focus) { const h = document.getElementById("h-" + n); if (h) h.focus({ preventScroll: true }); }
  if (location.hash !== "#step" + n) history.replaceState(null, "", "#step" + n);
}
function closeMenu() {
  document.getElementById("menu").hidden = true;
  document.getElementById("menuBtn").setAttribute("aria-expanded", "false");
}

/* ----- Build the page ----- */
function build() {
  const app = document.getElementById("app");
  app.innerHTML = BUILDERS.map((fn, i) => {
    const n = i + 1;
    const back = n > 1 ? `<button type="button" class="btn" data-go="${n - 1}">← Back</button>` : "";
    const next = n < TOTAL
      ? `<button type="button" class="btn primary${n === 1 ? " only" : ""}" data-go="${n + 1}">Next →</button>`
      : `<button type="button" class="btn" data-go="1">Back to start</button>`;
    const upnext = n < TOTAL ? `<p class="upnext">Next: ${esc(TRIP.stepTitles[n])}</p>` : "";
    return `<section class="step" id="s${n}" data-step="${n}" aria-labelledby="h-${n}" hidden>
      ${stepHead(n)}${fn()}<div class="stepnav">${back}${next}</div>${upnext}</section>`;
  }).join("");
  document.getElementById("menuList").innerHTML = TRIP.stepTitles.map((s, i) =>
    `<li><button type="button" data-go="${i + 1}">${i + 1}. ${esc(s)}</button></li>`).join("");
}

document.addEventListener("click", async e => {
  const el = e.target.closest("button, a");
  if (!el) return;
  if (el.id === "menuBtn") {
    const m = document.getElementById("menu");
    m.hidden = !m.hidden;
    el.setAttribute("aria-expanded", m.hidden ? "false" : "true");
    return;
  }
  if (el.dataset.go) { go(+el.dataset.go, true); return; }
  if (el.dataset.key) {
    setVal(el.dataset.key, el.dataset.val);
    storage.save(state); refresh(); return;
  }
  if (el.dataset.multi) {
    const g = state[el.dataset.multi];
    g[el.dataset.val] = !g[el.dataset.val];
    storage.save(state); refresh(); return;
  }
  if (el.id === "sendBtn") { el.href = waLink(buildMessage()); return; }
  if (el.id === "copyBtn") {
    const ok = await copyText(buildMessage());
    const st = document.getElementById("copyStatus");
    st.textContent = ok ? "✓ Copied. Now paste it in WhatsApp." : "Could not copy. Open \"See the message\" below and copy it by hand.";
  }
});

async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = s; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove();
    return ok;
  }
}

window.addEventListener("hashchange", () => {
  const m = location.hash.match(/^#step(\d)$/);
  if (m && +m[1] !== state.step) go(+m[1], true);
});

build();
refresh();
const fromHash = location.hash.match(/^#step(\d)$/);
go(fromHash ? +fromHash[1] : state.step, false);
</script>
